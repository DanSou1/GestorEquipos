services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Se conecta al SQL Server que ya corre en el host (SQLEXPRESS, puerto fijo 1433),
      # no a un SQL Server dentro de Docker. host.docker.internal es el nombre especial
      # que Docker Desktop resuelve hacia la máquina anfitriona.
      ConnectionStrings__DefaultConnection: "Server=host.docker.internal,1433;Database=AssetOps;User Id=${LOCAL_SQL_USER:?Set LOCAL_SQL_USER in .env};Password=${LOCAL_SQL_PASSWORD:?Set LOCAL_SQL_PASSWORD in .env};TrustServerCertificate=True;Connect Timeout=30;"
      BootstrapAdmin__Email: "${BOOTSTRAP_ADMIN_EMAIL:-}"
      BootstrapAdmin__Password: "${BOOTSTRAP_ADMIN_PASSWORD:-}"
      Smtp__FromAddress: "${SMTP_FROM_ADDRESS:-}"
      Smtp__Password: "${SMTP_APP_PASSWORD:-}"
    ports:
      - "8080:8080"
    volumes:
      # OPS-04: the image now runs as non-root user "appuser" (see Dockerfile), whose home
      # is /home/appuser — not /root. Update this path if that user ever changes.
      - dataprotection_keys:/home/appuser/.aspnet/DataProtection-Keys
    restart: unless-stopped

volumes:
  dataprotection_keys:
